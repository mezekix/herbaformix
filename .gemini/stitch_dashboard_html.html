<style>
        /* Custom scrollbar hide for clean mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Circular Progress CSS logic */
        .circular-chart {
            display: block;
            margin: 0 auto;
            max-width: 80%;
            max-height: 250px;
        }
        .circle-bg {
            fill: none;
            stroke: #edf2eb;
            stroke-width: 3.8;
        }
        .circle {
            fill: none;
            stroke-width: 2.8;
            stroke-linecap: round;
            animation: progress 1s ease-out forwards;
        }
        .percentage {
            fill: #141612;
            font-family: 'Manrope', sans-serif;
            font-weight: bold;
            font-size: 0.5em;
            text-anchor: middle;
        }
        @keyframes progress {
            0% { stroke-dasharray: 0 100; }
        }
        
        /* Checkbox custom styles */
        .checkbox-wrapper input:checked + div {
            background-color: #7ac144;
            border-color: #7ac144;
        }
        .checkbox-wrapper input:checked + div svg {
            display: block;
        }
        .checkbox-wrapper input:checked ~ span {
            text-decoration: line-through;
            color: #9ca3af;
        }
    </style>
<style>
